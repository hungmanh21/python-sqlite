[project]
name = "sqlite-scratch"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "hypothesis>=6.167.1",
    "pytest>=9.1.1",
]

[project.scripts]
quilldb = "quilldb.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
files = ["src"]

[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "ruff>=0.16.6",
]


